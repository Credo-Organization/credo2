services:
  - type: web
    name: credo-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://aicredits.in/v1
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Comma-separated origins allowed to call this API, e.g.
      # https://credo2-gamma.vercel.app
      #
      # The service previously sent allow_origins ["*"] alongside
      # allow_credentials, which browsers reject for credentialed requests
      # anyway, so the wildcard bought nothing while advertising an API that
      # has no auth of its own. Leaving this unset falls back to localhost
      # only, which will reject the deployed frontend.
      - key: ALLOWED_ORIGINS
        sync: false
